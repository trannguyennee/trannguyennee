# Profile CI — the profile repo checks itself on every push.
# 1) gitleaks: fail if any secret (API key, token, password...) ever lands in git history
# 2) SVG validation: every banner/card must be well-formed XML so it renders on GitHub
name: Profile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-assets:
    name: Validate SVG assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Check every SVG is well-formed
        run: |
          for f in assets/*.svg; do
            xmllint --noout "$f"
            echo "ok  $f"
          done
